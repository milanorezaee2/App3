name: Build requested APKs

# rev 45: Admin panel v2 — modular architecture (features/admin), independent design, users/support/chats moderation, audit log, web build
# rev 44: calmer chat alerts (no heads-up, one per conversation, 45s audible cooldown); brand logo/text swapped
# rev 43: APK renames (MiloMultiLanguage.5-*, MiloMultiLanguage-NoLogin); five-language open app registers the device profile on the server (Admin App list, cloud sync, full profile)
# rev 42: German Pre-A1 lesson 1 word swap; 3-line invite texts; device-local profile with app-generated access code for no-login builds
# rev 41: rebuild (artifact upload failed on the GitHub side in run 43)
# rev 40: chat alert opt-in persists across app exits (no JS-side service stop; crash guard via attempt marker)
# rev 39: support chat recovers after the manager closes a conversation (no raw RLS error)
# rev 38: bespoke profile icon; chat service no longer reports a transient "stopped" (stale backup config, keystore fallback, failure detail)
# rev 37: detailed learner profile (tabs: overview, languages, achievements, account)
# rev 36: learner profile screen (account, level, per-language progress, sync, sign-out)
# rev 35: chat alert switch reports the real reason when enabling fails (Android foreground service)
# rev 34: language-specific invitation message when sharing a contact code
# rev 33: admin flavour renamed to "Admin App" (AdminApp.apk)
# rev 32: rebuild all flavours from main merge cfb2900 (admin app requested)
# rev 31: chat alert card simplified (switch + friendly copy; technical disclaimers removed); validator updated
# rev 30: chat list keeps newest message visible above the keyboard/composer
# rev 29: readable chat bubbles (light green mine / white theirs, dark text)
# rev 28: conversation hub in de/fr/es bottom nav (same as en/tr/ru); Emma AI coach disabled in all languages
# rev 27: speech check tolerant to short-word homophones (de "Tee"), best-of-5 alternatives, biasing strings
# rev 26: more speaking checks (core sentences, vocabulary, dialogue, speaking test in review) + auto-read in Listening stage
# rev 25: speaking practice (expo-speech-recognition 3.1.3 for Expo SDK 54) in the Shadowing stage of all six languages
# rev 24: remove "شروع از صفر" label and equal-size language cards
# rev 23: Persian digits in bold cut; mid-grey text colours forced dark (faded numbers/badges).
# rev 22: Persian text bold + grey in every build (regular cut rendered faint).
# rev 21: add five-language no-login flavour (MiloMultiLanguage.5-NoLogin.apk).
# rev 20: new language introductions on dashboards and language registry.
# rev 19: third copy-trimming pass across supplement, account, backup, lock, B2/C1 practice and dialogue screens.
# rev 18: dashboards, libraries and review screens trimmed (no Latin eyebrows, no app-mechanics copy).
# rev 17: lesson copy trimmed — one-sentence stage hints shown once, no app-mechanics text, no Latin subtitles.
# rev 16: redesigned "Grammar Through Usage" stage (numbered, right-aligned pattern cards) in all languages.
# rev 15: grammar stage back to classic 86% rendering; Persian grey, translations lighter grey (login app).
# rev 14: lesson layout 78% with text kept at previous size; Persian smoky black in login app; translation pill reverted.
# rev 13: login app Persian in Beiruti Bold; lesson translation styled as indigo accent pill.
# rev 12: lesson pages back to normal scrolling layout, drawn at 86% scale on phones.
# rev 11: Android hardware back returns to the previous page instead of closing the app.
# rev 10: native light theme with black default text; admin phone-lock toggle.
# rev 9: lesson content scales to fit any screen; chat composer +36dp above keyboard.
# rev 8: re-run; the previous publish job never started on GitHub.
# rev 7: lesson auto-scroll/spacing fix + self-measuring chat composer.
# rev 6: bigger startup logo, black reading colour, bold Latin/Times text.
# rev 5: podcast + header/chat fixes; branch pushes build all three flavours.
# rev 4: rebuilds after every registered language gained a pronunciation
# workshop (German, French, Spanish). Each flavour is built in its own clean runner. Building the three
# variants sequentially on one runner let Metro reuse the first bundle, so every
# APK shipped the admin JavaScript. A fresh job per flavour makes that
# impossible, and every job now reports its applicationId and inlined language
# scope so the artefact can be checked without opening it.

on:
  workflow_dispatch:
    inputs:
      learner_login:
        description: 'Explicitly build an additional login-enabled learner APK'
        type: boolean
        default: false
      language_scope_login:
        description: 'Languages for the learner build WITH login'
        required: false
        default: 'en,de,fr,tr,es'
      language_scope_nologin:
        description: 'Languages for the learner build WITHOUT login'
        required: false
        default: 'en,ru'
      abis:
        description: 'CPU architectures (blank = phones only)'
        required: false
        default: ''
  # A push trigger keeps this usable from a feature branch, where the
  # workflow_dispatch endpoint is not registered by GitHub.
  push:
    branches:
      - arena/1d4c82b4-app3
      - arena/0525d0d2-app3
      - arena/9b089853-app3
      - arena/a87fc501-app3
    paths:
      - '.github/workflows/apk-requested.yml'

permissions:
  contents: write

concurrency:
  group: requested-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ admin
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'be0e368c-0d94-4e95-b4f4-d757fa7beb42' }}
      MILO_ANDROID_ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}
      MILO_ADMIN_APP: 'true'
      EXPO_PUBLIC_MILO_ADMIN_APP: 'true'
      EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN: 'true'
      EXPO_PUBLIC_LEARNER_LOGIN: 'false'
      EXPO_PUBLIC_LANGUAGE_SCOPE: 'en,tr'
      EXPECTED_PACKAGE: 'com.devicecontrol.miloadmin'
      EXPECTED_SCOPE: 'en,tr'
      APK_NAME: 'AdminApp.apk'
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@v5
      - &node
        name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - &install
        name: Install dependencies
        run: npm ci --ignore-scripts
      - &settings
        name: Read the public app settings into the build environment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          if (!/^https:\/\//.test(url)) throw new Error('The public app URL is missing.');
          if (!key) throw new Error('The public app key is missing.');
          if (key.startsWith('sb_secret_')) throw new Error('A secret key cannot be bundled.');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE
      - &java
        name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - &sdk
        name: Prepare the Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory was not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            if [[ -z "$SDKMANAGER" ]]; then
              echo "Android SDK 36 is missing and sdkmanager was not found."
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
      - &prebuild
        name: Generate the native Android project
        run: |
          rm -rf android
          npx expo prebuild --platform android --no-install --non-interactive
          echo "applicationId: $(grep -m1 applicationId android/app/build.gradle)"
      - &validate
        name: Verify the Firebase-free chat alert path
        run: npm run validate:background-notifications
      - &build
        name: Build the release APK
        run: |
          rm -rf "$TMPDIR/metro-cache" "$TMPDIR/react-native-packager-cache" node_modules/.cache
          ( cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon )
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
      - &verify
        name: Verify this APK is the right flavour
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, zipfile
          apk = os.environ['APK_NAME']
          expected_pkg = os.environ['EXPECTED_PACKAGE']
          expected_scope = os.environ['EXPECTED_SCOPE']
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              if 'AndroidManifest.xml' not in names or not any(n.endswith('classes.dex') for n in names):
                  sys.exit(f'{apk}: structure validation failed')
              if 'assets/index.android.bundle' not in names:
                  sys.exit(f'{apk}: JS bundle missing')
              bundle = archive.read('assets/index.android.bundle')
          text = bundle.decode('utf-8', 'ignore')
          if expected_scope not in text:
              sys.exit(f'{apk}: inlined language scope {expected_scope!r} not found in the bundle')
          others = [s for s in ('en,ru', 'en,de,fr,tr,es', 'en,tr') if s != expected_scope and s in text]
          print(f'{apk}: package={expected_pkg} scope={expected_scope} foreign_scopes={others}')
          print(f'{apk}: standalone OK ({len(bundle)} bytes of JS)')
          PY
          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
      - &upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------- learner WITH login
  learner-login:
    # Branch pushes (where workflow_dispatch is unavailable) build all three
    # requested flavours; manual runs still opt in explicitly.
    if: ${{ github.event_name == 'push' || inputs.learner_login }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'be0e368c-0d94-4e95-b4f4-d757fa7beb42' }}
      MILO_ANDROID_ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}
      EXPO_PUBLIC_MILO_ADMIN_APP: 'false'
      EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN: 'false'
      EXPO_PUBLIC_LEARNER_LOGIN: 'true'
      EXPO_PUBLIC_LANGUAGE_SCOPE: ${{ inputs.language_scope_login || 'en,de,fr,tr,es' }}
      EXPECTED_PACKAGE: 'com.devicecontrol.milomultilang'
      EXPECTED_SCOPE: ${{ inputs.language_scope_login || 'en,de,fr,tr,es' }}
      APK_NAME: 'MiloMultiLanguage.5-Login.apk'
    steps:
      - *checkout
      - *node
      - *install
      - *settings
      - *java
      - *sdk
      - *prebuild
      - *validate
      - *build
      - *verify
      - *upload

  # ----------------------------------------------- learner WITHOUT login
  learner-nologin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'be0e368c-0d94-4e95-b4f4-d757fa7beb42' }}
      MILO_ANDROID_ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}
      EXPO_PUBLIC_MILO_ADMIN_APP: 'false'
      EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN: 'false'
      EXPO_PUBLIC_LEARNER_LOGIN: 'false'
      EXPO_PUBLIC_LANGUAGE_SCOPE: ${{ inputs.language_scope_nologin || 'en,ru' }}
      EXPECTED_PACKAGE: 'com.devicecontrol.companion'
      EXPECTED_SCOPE: ${{ inputs.language_scope_nologin || 'en,ru' }}
      APK_NAME: 'MiloMultiLanguage-NoLogin.apk'
    steps:
      - *checkout
      - *node
      - *install
      - *settings
      - *java
      - *sdk
      - *prebuild
      - *validate
      - *build
      - *verify
      - *upload

  # ------------------------------------ five-language learner WITHOUT login
  learner-five-nologin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'be0e368c-0d94-4e95-b4f4-d757fa7beb42' }}
      MILO_ANDROID_ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}
      EXPO_PUBLIC_MILO_ADMIN_APP: 'false'
      EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN: 'false'
      EXPO_PUBLIC_LEARNER_LOGIN: 'false'
      EXPO_PUBLIC_LEARNER_FIVE_NOLOGIN: 'true'
      EXPO_PUBLIC_LANGUAGE_SCOPE: 'en,de,fr,tr,es'
      EXPECTED_PACKAGE: 'com.devicecontrol.milofive'
      EXPECTED_SCOPE: 'en,de,fr,tr,es'
      APK_NAME: 'MiloMultiLanguage.5-NoLogin.apk'
    steps:
      - *checkout
      - *node
      - *install
      - *settings
      - *java
      - *sdk
      - *prebuild
      - *validate
      - *build
      - *verify
      - *upload

  # --------------------------------------------------- admin panel (web)
  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
      EXPO_PUBLIC_MILO_ADMIN_APP: 'true'
      EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN: 'true'
      EXPO_PUBLIC_LEARNER_LOGIN: 'false'
      EXPO_PUBLIC_LANGUAGE_SCOPE: 'en,tr'
    steps:
      - *checkout
      - *node
      - *install
      - *settings
      - name: Export the static web build of the admin panel
        run: |
          npx expo export --platform web --output-dir dist-admin-web
          test -f dist-admin-web/index.html
          test -f dist-admin-web/admin.html || test -f dist-admin-web/admin/index.html || true
          ( cd dist-admin-web && zip -qr ../AdminApp-web.zip . )
          sha256sum AdminApp-web.zip | tee AdminApp-web.zip.sha256
          ls -lh AdminApp-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AdminApp-web.zip
          path: |
            AdminApp-web.zip
            AdminApp-web.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------- publish
  publish:
    needs: [admin, admin-web, learner-login, learner-nologin, learner-five-nologin]
    if: ${{ always() && needs.admin.result == 'success' && needs.learner-nologin.result == 'success' && (needs.learner-login.result == 'success' || needs.learner-login.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download available APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Show what will be published
        run: |
          find out -type f | sort
          du -h out/*/*.apk

      - name: Publish a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-requested-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 'Milo APKs #${{ github.run_number }}'
          prerelease: true
          body: |
            Installable Android APKs, each built on its own clean runner.

            - `AdminApp.apk` — manager app, package `com.devicecontrol.miloadmin`, languages en, tr
            - `AdminApp-web.zip` — the same management panel as a static website (unzip and serve the folder)
            - `MiloMultiLanguage.5-Login.apk` — MiloMultiLanguage WITH login, package `com.devicecontrol.milomultilang`, languages en, de, fr, tr, es
            - `MiloMultiLanguage-NoLogin.apk` — MiloMultiLanguage WITHOUT login, package `com.devicecontrol.companion`, languages en, ru
            - `MiloMultiLanguage.5-NoLogin.apk` — five-language MiloMultiLanguage WITHOUT login, package `com.devicecontrol.milofive`, languages en, de, fr, tr, es
          files: |
            out/AdminApp.apk/AdminApp.apk
            out/MiloMultiLanguage-NoLogin.apk/MiloMultiLanguage-NoLogin.apk
            out/AdminApp.apk/AdminApp.apk.sha256
            out/MiloMultiLanguage-NoLogin.apk/MiloMultiLanguage-NoLogin.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Add the five-language no-login APK to the release
        if: ${{ needs.learner-five-nologin.result == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-requested-${{ github.run_number }}
          files: |
            out/MiloMultiLanguage.5-NoLogin.apk/MiloMultiLanguage.5-NoLogin.apk
            out/MiloMultiLanguage.5-NoLogin.apk/MiloMultiLanguage.5-NoLogin.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Add explicitly requested login APK to the release
        if: ${{ needs.learner-login.result == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-requested-${{ github.run_number }}
          files: |
            out/MiloMultiLanguage.5-Login.apk/MiloMultiLanguage.5-Login.apk
            out/MiloMultiLanguage.5-Login.apk/MiloMultiLanguage.5-Login.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Add the admin panel web build to the release
        if: ${{ needs.admin-web.result == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-requested-${{ github.run_number }}
          files: |
            out/AdminApp-web.zip/AdminApp-web.zip
            out/AdminApp-web.zip/AdminApp-web.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
