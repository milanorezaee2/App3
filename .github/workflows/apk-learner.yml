name: Build learner APK

# Builds one installable Android APK of the learner app (English and
# Russian courses together) and keeps it as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU architectures to package (e.g. arm64-v8a,armeabi-v7a). Blank = phones only.'
        required: false
        default: ''
      language_scope:
        description: 'Optional comma-separated languages to include in the learner build.'
        required: false
        default: ''
  push:
    branches:
      - arena/940e66ab-app3
      - arena/358727c9-app3
    paths:
      - '.github/workflows/apk-learner.yml'
      - '.github/scripts/apk-learner-smoke.sh'
      - 'scripts/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: learner-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-learner-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
      # Real phones need arm64-v8a (current) or armeabi-v7a (old). x86/x86_64
      # only exist for emulators and roughly double the native payload.
      # Blank input therefore means "phones only", not "everything".
      MILO_ANDROID_ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}
      EXPO_PUBLIC_LANGUAGE_SCOPE: ${{ inputs.language_scope || (github.ref_name == 'arena/358727c9-app3' && 'en,ru,tr,de,fr,es') || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read the public app settings into the build environment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          if (!/^https:\/\//.test(url)) throw new Error('The public app URL is missing.');
          if (!key) throw new Error('The public app key is missing.');
          if (key.startsWith('sb_secret_')) throw new Error('A secret key cannot be bundled.');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - name: Verify core curricula and speech policy
        run: |
          npm run typecheck
          npm run validate:hygiene
          npm run validate:content
          npm run validate:russian
          npm run validate:english-engine
          npm run validate:english-lesson-flow
          npm run validate:speech-policy
          node scripts/verify-starter-speech.cjs
          npm run validate:pronunciation
          npm run validate:registration-admin
          npm run validate:language-entry
          npm run validate:a11y
          npm run validate:requested-updates

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare the Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory was not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            if [[ -z "$SDKMANAGER" ]]; then
              echo "Android SDK 36 is missing and sdkmanager was not found."
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build the release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is standalone
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
          if 'AndroidManifest.xml' not in names or not any(n.endswith('classes.dex') for n in names):
              raise SystemExit('APK structure validation failed.')
          if 'assets/index.android.bundle' not in names:
              raise SystemExit('The JS bundle is missing; the APK would need Metro.')
          print('Standalone APK verified.')
          PY
          cp android/app/build/outputs/apk/release/app-release.apk MiloLanguages.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs MiloLanguages.apk
          sha256sum MiloLanguages.apk | tee MiloLanguages.apk.sha256
          ls -lh MiloLanguages.apk

      # Informational only. The budget is enforced in a later step, after the
      # artifact is uploaded, so a size miss can never discard the APK.
      - name: Report APK composition
        run: node scripts/apk-report.mjs MiloLanguages.apk

      # GitHub serves job logs from a host that is not always reachable, so the
      # numbers are also written where they survive: on the pull request.
      - name: Publish the APK size report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ ! -s MiloLanguages.apk ]; then
            echo 'APK was not produced, so there is no size report.' > /tmp/report.md
          else
            {
              echo "### APK size report · \`$GITHUB_REF_NAME\`"
              echo
              echo '```'
              node scripts/apk-report.mjs MiloLanguages.apk 2>&1 || true
              echo '```'
              echo
              echo "Artifact size: $(du -h MiloLanguages.apk | cut -f1)"
              echo
              echo "<details><summary>Build inputs</summary>"
              echo
              echo '```'
              echo "MILO_ANDROID_ABIS = ${MILO_ANDROID_ABIS:-<unset>}"
              if [ -f android/gradle.properties ]; then
                echo "gradle.properties  = $(grep '^reactNativeArchitectures' android/gradle.properties || echo '<not present>')"
              fi
              if [ -f android/app/build.gradle ]; then
                echo "build.gradle       = $(grep -o 'abiFilters.*' android/app/build.gradle | head -1 || echo '<not present>')"
              fi
              echo '```'
              echo
              echo "</details>"
            } > /tmp/report.md
          fi
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${PR:-}" ]; then
            gh pr comment "$PR" --body-file /tmp/report.md
            echo "Posted the report to PR #$PR"
          else
            echo "No open pull request for $GITHUB_REF_NAME; the report is in the job summary only."
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: MiloLanguages-apk
          path: |
            MiloLanguages.apk
            MiloLanguages.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check whether this APK can run on the emulator
        id: emulator_abi
        run: |
          if unzip -l MiloLanguages.apk | grep -q 'lib/x86_64/'; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator smoke test skipped::This APK has no x86_64 libraries, so it cannot be installed on the x86_64 emulator. The universal build in 'Build MiloMultilang Android APK' still covers the emulator smoke test."
          fi

      - name: Boot an emulator and check that the app starts
        if: steps.emulator_abi.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/apk-learner-smoke.sh MiloLanguages.apk

      - name: Enforce the APK size budget
        if: always()
        run: |
          if [ ! -s MiloLanguages.apk ]; then
            echo "No APK was produced; the build failed earlier."
            exit 1
          fi
          node scripts/apk-report.mjs MiloLanguages.apk --limit-mb 60

      - name: Keep the emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            /tmp/milo-screen.png
            /tmp/window.xml
          if-no-files-found: warn
          retention-days: 3
